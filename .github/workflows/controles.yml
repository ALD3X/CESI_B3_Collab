# 1. Qualité et sécurité du code : 4 jobs en parallèle, sur toutes les branches et toutes les PR.
# Appelé par pipeline.yml.
name: Contrôles qualité et sécurité

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.24.3
  TRIVY_IMAGE: aquasec/trivy:0.65.0
  SEMGREP_IMAGE: semgrep/semgrep:1.99.0

jobs:
  secrets:
    name: "Secrets (gitleaks)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recherche de secrets dans le code
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" dir /repo --no-banner --redact

  backend:
    name: "Backend : tests + couverture (Java 25)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/back/**/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Tests unitaires et d'intégration + seuil de couverture (70 % par service)
        run: npx turbo run test --filter=@boutique/back
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-backend
          path: |
            apps/back/*/target/surefire-reports/
            apps/back/*/target/site/jacoco/

  front:
    name: "Front : tests + couverture (React)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Tests (Vitest) + seuil de couverture (70 %)
        run: npx turbo run test --filter=@boutique/front

  sast-sca:
    name: "SAST (Semgrep) + SCA (Trivy)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SAST - analyse statique de sécurité (bloquant si sévérité ERROR)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/java --config p/react --config p/secrets \
            --severity ERROR --error --metrics off --exclude "**/target" --exclude node_modules .
      - name: SCA - vulnérabilités des dépendances Maven et npm (bloquant si CRITIQUE corrigeable)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --quiet --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 /src
