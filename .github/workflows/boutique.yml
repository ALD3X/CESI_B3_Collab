# Pipeline CI/CD de la boutique — GitHub Actions
# Mêmes étapes, mêmes outils et mêmes scripts (demos/boutique/ci/*.sh) que le Jenkinsfile.
#
# Branches et environnements :
#   feature/* → PR vers dev : contrôles qualité + images + test de bout en bout (aucun déploiement)
#   dev  (par défaut) : images construites UNE fois (v-<version>), publiées, déployées en dev
#   accp (recette)    : MÊMES images promues (pas de reconstruction), déployées en recette, recette validée
#   prod (production) : version recettée uniquement, mise en production manuelle par un approbateur,
#                       déploiement progressif, test de fumée, retour arrière automatique
name: CI/CD boutique

on:
  push:
    branches: [dev, accp, prod]
    paths: ["demos/boutique/**", ".github/workflows/boutique.yml"]
  pull_request:
    branches: [dev, accp, prod]
    paths: ["demos/boutique/**", ".github/workflows/boutique.yml"]
  workflow_dispatch:
    inputs:
      mise_en_production:
        description: "Mettre en production la version de la branche prod (approbateurs uniquement)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: boutique-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.24.3
  TRIVY_IMAGE: aquasec/trivy:0.65.0
  SEMGREP_IMAGE: semgrep/semgrep:1.99.0

defaults:
  run:
    working-directory: demos/boutique

jobs:
  # ---------- 1. Qualité et sécurité du code (4 jobs en parallèle, toutes les branches) ----------
  secrets:
    name: "Secrets (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recherche de secrets dans le code
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" dir /repo --no-banner --redact

  backend:
    name: "Backend : tests + couverture (Java 21)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: demos/boutique/backend/**/pom.xml
      - name: Tests unitaires et d'intégration + seuil de couverture (70 % par service)
        run: mvn -B -ntp -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-backend
          path: |
            demos/boutique/backend/*/target/surefire-reports/
            demos/boutique/backend/*/target/site/jacoco/

  front:
    name: "Front : tests + couverture (React)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/boutique/front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: demos/boutique/front/package-lock.json
      - run: npm ci
      - name: Tests (Vitest) + seuil de couverture (70 %)
        run: npm test

  sast-sca:
    name: "SAST (Semgrep) + SCA (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAST - analyse statique de sécurité (bloquant si sévérité ERROR)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/java --config p/react --config p/secrets \
            --severity ERROR --error --metrics off --exclude "**/target" .
      - name: SCA - vulnérabilités des dépendances Maven et npm (bloquant si CRITIQUE corrigeable)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --quiet --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 /src

  # ---------- 2. Images : construites une seule fois, puis promues ----------
  images:
    name: "Images : build, scan, test de bout en bout, publication"
    needs: [secrets, backend, front, sast-sca]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version du code et registre
        id: version
        run: |
          v=$(sh ci/images.sh version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v-$v" >> "$GITHUB_OUTPUT"
          echo "REGISTRE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_ENV"
          echo "TAG=v-$v" >> "$GITHUB_ENV"
          echo "### Version v-$v (branche ${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Images déjà construites pour cette version ? (promotion sur accp et prod)
        id: present
        if: github.ref_name == 'accp' || github.ref_name == 'prod'
        run: |
          if sh ci/images.sh present; then echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Images v-${{ steps.version.outputs.version }} **promues sans reconstruction**." >> "$GITHUB_STEP_SUMMARY"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build des 9 images
        if: steps.present.outputs.ok != 'true'
        run: docker compose build
      - name: Scan des images (bloquant si vulnérabilité CRITIQUE corrigeable)
        if: steps.present.outputs.ok != 'true'
        run: sh ci/scan-images.sh
      - name: Test de bout en bout (boutique complète, parcours client)
        if: steps.present.outputs.ok != 'true'
        run: sh ci/smoke-test.sh boutique-ci
      - name: Publication des images v-<version>
        if: steps.present.outputs.ok != 'true' && github.event_name == 'push'
        run: docker compose push

  # ---------- 3. Déploiements ----------
  # Sans secret KUBECONFIG, les environnements sont créés à la volée dans le runner (Docker Compose
  # pour dev, cluster Kubernetes éphémère kind pour accp et prod). Avec le secret KUBECONFIG de
  # l'environnement GitHub, le même job déploie sur le vrai cluster.
  deployer-dev:
    name: "Déploiement dev"
    needs: images
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, packages: write }
    env:
      TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: echo "REGISTRE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_ENV"
      - name: Récupération des images de la version
        run: docker compose --profile rabbit pull -q
      - name: Déploiement et test de fumée
        run: sh ci/deployer.sh dev
      - name: Étiquette « dev »
        run: sh ci/images.sh etiqueter dev

  deployer-accp:
    name: "Recette (accp) : déploiement + validation"
    needs: images
    if: github.event_name == 'push' && github.ref_name == 'accp'
    runs-on: ubuntu-latest
    environment: accp
    permissions: { contents: read, packages: write }
    env:
      TAG: ${{ needs.images.outputs.tag }}
      KUBECONFIG_CONTENU: ${{ secrets.KUBECONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: echo "REGISTRE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_ENV"
      - name: Cible - cluster Kubernetes éphémère (aucun KUBECONFIG fourni)
        if: env.KUBECONFIG_CONTENU == ''
        uses: helm/kind-action@v1
        with: { cluster_name: boutique }
      - name: Cible - cluster réel de l'environnement
        if: env.KUBECONFIG_CONTENU != ''
        run: mkdir -p ~/.kube && printf '%s' "$KUBECONFIG_CONTENU" > ~/.kube/config
      - name: Images pour le cluster éphémère
        if: env.KUBECONFIG_CONTENU == ''
        run: |
          docker compose pull -q
          echo "CHARGER_IMAGES=kind:boutique" >> "$GITHUB_ENV"
      - name: Déploiement, attente du déploiement progressif et test de fumée
        run: sh ci/deployer.sh accp
      - name: Recette validée → étiquettes « accp » et « accp-<version> »
        run: |
          sh ci/images.sh etiqueter accp
          sh ci/images.sh etiqueter "accp-${{ needs.images.outputs.version }}"
          echo "Version **${{ needs.images.outputs.version }}** recettée : prête pour la production." >> "$GITHUB_STEP_SUMMARY"

  candidat-prod:
    name: "Production : contrôle de la version candidate"
    needs: images
    if: github.ref_name == 'prod' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Seule une version recettée peut aller en production
        run: |
          export REGISTRE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/"
          sh ci/images.sh present "accp-${{ needs.images.outputs.version }}"
          echo "Version **${{ needs.images.outputs.version }}** recettée. Mise en production : *Run workflow* sur la branche prod, case cochée." >> "$GITHUB_STEP_SUMMARY"

  deployer-prod:
    name: "Production : approbation + déploiement"
    needs: [images, candidat-prod]
    if: github.event_name == 'workflow_dispatch' && inputs.mise_en_production && github.ref_name == 'prod'
    runs-on: ubuntu-latest
    # L'environnement « production » accueille l'approbation native de GitHub (relecteurs obligatoires)
    # dès que le dépôt est public ou en offre Pro/Team. En attendant, contrôle de l'approbateur ci-dessous.
    environment: production
    permissions: { contents: write, packages: write }
    env:
      TAG: ${{ needs.images.outputs.tag }}
      KUBECONFIG_CONTENU: ${{ secrets.KUBECONFIG }}
    steps:
      - name: Contrôle de l'approbateur (liste APPROBATEURS_PROD)
        working-directory: .
        run: |
          approbateurs="${{ vars.APPROBATEURS_PROD || github.repository_owner }}"
          case " $approbateurs " in
            *" ${{ github.actor }} "*) echo "Mise en production approuvée par ${{ github.actor }}." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::${{ github.actor }} ne fait pas partie des approbateurs de la production ($approbateurs)"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: echo "REGISTRE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_ENV"
      - name: Cible - cluster Kubernetes éphémère (aucun KUBECONFIG fourni)
        if: env.KUBECONFIG_CONTENU == ''
        uses: helm/kind-action@v1
        with: { cluster_name: boutique }
      - name: Cible - cluster réel de l'environnement
        if: env.KUBECONFIG_CONTENU != ''
        run: mkdir -p ~/.kube && printf '%s' "$KUBECONFIG_CONTENU" > ~/.kube/config
      - name: Images pour le cluster éphémère
        if: env.KUBECONFIG_CONTENU == ''
        run: |
          docker compose pull -q
          echo "CHARGER_IMAGES=kind:boutique" >> "$GITHUB_ENV"
      - name: Déploiement progressif, test de fumée, retour arrière automatique si échec
        run: sh ci/deployer.sh prod
      - name: Étiquettes « prod » et « prod-<version> », tag Git de livraison
        run: |
          sh ci/images.sh etiqueter prod
          sh ci/images.sh etiqueter "prod-${{ needs.images.outputs.version }}"
          git tag "livraison-$(date -u +%Y%m%d-%H%M)-${{ needs.images.outputs.version }}"
          git push origin --tags
