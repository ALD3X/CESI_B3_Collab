# Démo EPIC 06 — Déploiement du mini-service catalogue (image de la démo CI/CD) sur Kubernetes
# Illustre : namespace par zone, Deployment redondé, sondes de santé, limites de ressources,
# conteneur non-root, Service interne, mise à l'échelle automatique (HPA), budget de perturbation (PDB),
# et cloisonnement réseau (NetworkPolicy, appliquée si le plugin réseau la prend en charge).
apiVersion: v1
kind: Namespace
metadata:
  name: zone-applicative
  labels:
    zone: applicative
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: zone-applicative
  labels: { app: catalogue, composant: SV-1 }
spec:
  replicas: 2                       # redondance : au moins 2 instances (US-03.2 §4)
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # aucune coupure pendant une mise à jour
  selector:
    matchLabels: { app: catalogue }
  template:
    metadata:
      labels: { app: catalogue, composant: SV-1 }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:    # répartir les instances sur des nœuds différents
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: catalogue } }
      containers:
        - name: catalogue
          image: petite-maison/catalogue:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000, name: http }]
          readinessProbe:           # le Service n'envoie du trafic qu'aux instances prêtes
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:            # le kubelet redémarre une instance bloquée
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: zone-applicative
spec:
  selector: { app: catalogue }
  ports: [{ port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalogue
  namespace: zone-applicative
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: catalogue }
  minReplicas: 2
  maxReplicas: 6                    # pics : festival, sortie du fanzine, exclusivités Evil Ed
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalogue
  namespace: zone-applicative
spec:
  minAvailable: 1                   # une maintenance de nœud ne coupe jamais toutes les instances
  selector:
    matchLabels: { app: catalogue }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalogue-entree-passerelle
  namespace: zone-applicative
spec:
  podSelector: { matchLabels: { app: catalogue } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { zone: applicative } }   # pas d'accès direct depuis l'extérieur de la zone
      ports: [{ port: 8000 }]
