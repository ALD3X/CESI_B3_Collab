apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-applicative
resources:
  - ../../../base/applicative
configMapGenerator:
  - name: boutique-env
    literals:
      - ENVIRONNEMENT=prod
      - ZONE_APPLICATIVE=prod-applicative
      - ZONE_DONNEES=prod-donnees
patches:
  - target: { kind: NetworkPolicy, name: passerelle-depuis-zone-publique }
    patch: |-
      - { op: add, path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/env, value: prod }
      - { op: add, path: /spec/ingress/0/from/1/namespaceSelector/matchLabels/env, value: prod }
  - target: { kind: NetworkPolicy, name: services-internes }
    patch: |-
      - { op: add, path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/env, value: prod }
  - target: { kind: Deployment }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 2 }
