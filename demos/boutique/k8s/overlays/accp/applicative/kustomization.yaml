apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: accp-applicative
resources:
  - ../../../base/applicative
configMapGenerator:
  - name: boutique-env
    literals:
      - ENVIRONNEMENT=accp
      - ZONE_APPLICATIVE=accp-applicative
      - ZONE_DONNEES=accp-donnees
patches:
  - target: { kind: NetworkPolicy, name: passerelle-depuis-zone-publique }
    patch: |-
      - { op: add, path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/env, value: accp }
      - { op: add, path: /spec/ingress/0/from/1/namespaceSelector/matchLabels/env, value: accp }
  - target: { kind: NetworkPolicy, name: services-internes }
    patch: |-
      - { op: add, path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/env, value: accp }
  - target: { kind: Deployment }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
      - { op: replace, path: /spec/maxReplicas, value: 2 }
  - target: { kind: PodDisruptionBudget }
    patch: |-
      - { op: replace, path: /spec/minAvailable, value: 0 }
