apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: accp-publique
resources:
  - ../../../base/publique
configMapGenerator:
  - name: boutique-env
    literals:
      - ENVIRONNEMENT=accp
      - ZONE_APPLICATIVE=accp-applicative
      - ZONE_DONNEES=accp-donnees
patches:
  - target: { kind: Deployment }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: Service, name: front }
    patch: |-
      - { op: replace, path: /spec/ports/0/nodePort, value: 30081 }
