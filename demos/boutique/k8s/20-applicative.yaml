# Zone applicative : passerelle et services métier Spring Boot (images du pipeline CI/CD).
# Même gabarit durci pour chaque service : non-root, système de fichiers en lecture seule, sondes, limites.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passerelle
  namespace: zone-applicative
  labels: { app: passerelle, composant: EN-2 }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # aucune coupure pendant une mise à jour
  selector:
    matchLabels: { app: passerelle }
  template:
    metadata:
      labels: { app: passerelle, composant: EN-2, exposition: passerelle }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:          # répartir les instances sur des nœuds différents
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: passerelle } }
      containers:
        - name: passerelle
          image: boutique-passerelle:latest
          imagePullPolicy: IfNotPresent
          lifecycle:                      # laisse 5 s pour retirer le pod du Service avant l'arrêt (zéro 500)
            preStop:
              sleep: { seconds: 5 }
          env:
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: jwt, key: JWT_SECRET } } }
            - { name: REDIS_HOTE, value: "redis.zone-donnees" }
          ports: [{ containerPort: 8080, name: http }]
          startupProbe:                   # laisse à la JVM le temps de démarrer
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:                 # le Service n'envoie du trafic qu'aux instances prêtes
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:                  # le kubelet redémarre une instance bloquée
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: passerelle, namespace: zone-applicative }
spec:
  selector: { app: passerelle }
  ports: [{ port: 8080, targetPort: http }]
