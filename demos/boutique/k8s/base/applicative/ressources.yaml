apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalogue
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: catalogue }
  minReplicas: 2
  maxReplicas: 6                          # pics : festival, sortie du fanzine, exclusivités Evil Ed
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalogue
spec:
  minAvailable: 1                         # une maintenance de nœud ne coupe jamais toutes les instances
  selector:
    matchLabels: { app: catalogue }
---
# Cloisonnement réseau entre zones (NetworkPolicy) : chaque zone n'accepte que les flux prévus.
#   zone-publique  → passerelle (zone-applicative) → services internes → zone-donnees
# Un appel direct à un service interne depuis une autre zone est bloqué.

# Passerelle : seul point d'entrée de la zone applicative, appelée par le front
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: passerelle-depuis-zone-publique
spec:
  podSelector: { matchLabels: { exposition: passerelle } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { zone: publique } }
        - namespaceSelector: { matchLabels: { zone: applicative } }
      ports: [{ port: 8080 }]
---
# Services internes : appelables uniquement depuis la zone applicative (passerelle, autres services)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-internes
spec:
  podSelector: { matchLabels: { exposition: interne } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { zone: applicative } }
      ports: [{ port: 8080 }]
