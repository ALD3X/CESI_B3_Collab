# Boutique sur Kubernetes — un namespace par zone de sécurité (US-03.2 §5, US-06.1)
apiVersion: v1
kind: Namespace
metadata:
  name: zone-publique
  labels: { zone: publique }
---
apiVersion: v1
kind: Namespace
metadata:
  name: zone-applicative
  labels: { zone: applicative }
---
apiVersion: v1
kind: Namespace
metadata:
  name: zone-donnees
  labels: { zone: donnees }
---
# Secret partagé de signature des jetons (démo). En production : coffre de secrets + clés RS256.
apiVersion: v1
kind: Secret
metadata:
  name: jwt
  namespace: zone-applicative
type: Opaque
stringData:
  JWT_SECRET: "demo-secret-petite-maison-epouvante-2026!"
