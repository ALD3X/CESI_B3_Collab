server:
  port: 8080
spring:
  application:
    name: commandes
  main:
    banner-mode: "off"
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/commandes}
    username: ${DB_UTILISATEUR:commandes}
    password: ${DB_MOT_DE_PASSE:commandes}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # démo. En production : migrations versionnées (Flyway)
  rabbitmq:
    host: ${RABBITMQ_HOTE:rabbitmq}
    username: ${RABBITMQ_UTILISATEUR:demo}
    password: ${RABBITMQ_MOT_DE_PASSE:demo}
  cloud:
    stream:
      # BUS=rabbit ou BUS=kafka : même code, broker choisi au démarrage
      default-binder: ${BUS:rabbit}
      bindings:
        commandesPayees-out-0:
          destination: commandes
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:kafka:29092}
          auto-create-topics: true
          min-partition-count: 3
          replication-factor: 1
management:
  health:
    rabbit:
      enabled: false   # le binder inutilisé ne doit pas rendre le service « malade »
  endpoint:
    health:
      probes:
        enabled: true
boutique:
  catalogue-url: ${CATALOGUE_URL:http://catalogue:8080}
  jwt:
    secret: ${JWT_SECRET:secret-de-developpement-uniquement-0123456789}
    emetteur: petite-maison
  demo:
    evenement-invalide: ${DEMO_EVENEMENT_INVALIDE:false}
