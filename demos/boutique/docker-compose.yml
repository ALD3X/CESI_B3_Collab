# Boutique de démonstration — La Petite Maison de l'Épouvante
# Lancement conseillé : python boutique.py demarrer [--bus rabbit|kafka] [--passerelle spring|kong]
name: boutique

x-secret: &jwt-secret "demo-secret-petite-maison-epouvante-2026!"   # démo locale uniquement

# Paramètres communs aux services Spring Boot
x-service: &service
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
    interval: 5s
    timeout: 3s
    retries: 40
    start_period: 10s

x-env-bus: &env-bus
  BUS: ${BUS:-rabbit}                 # rabbit | kafka : même code, broker choisi au démarrage
  RABBITMQ_HOTE: rabbitmq
  KAFKA_BROKERS: kafka:29092
  JWT_SECRET: *jwt-secret

x-depend-bus: &depend-bus
  rabbitmq: { condition: service_healthy, required: false }
  kafka: { condition: service_healthy, required: false }

services:
  # ---------------- Front ----------------
  front:
    build: ./front
    image: ${REGISTRE:-}boutique-front:${TAG:-latest}
    restart: unless-stopped
    environment:
      PASSERELLE_HOTE: ${PASSERELLE_HOTE:-passerelle-spring:8080}
      PASSERELLE_NOM: ${PASSERELLE_NOM:-Spring Cloud Gateway}
      BUS: ${BUS_NOM:-RabbitMQ}
    ports:
      - "3000:8080"                   # http://localhost:3000
    depends_on: [passerelle-spring, kong]

  # ---------------- Passerelles (les deux tournent, le front en utilise une) ----------------
  passerelle-spring:
    <<: *service
    build: { context: ./backend, args: { MODULE: passerelle } }
    image: ${REGISTRE:-}boutique-passerelle:${TAG:-latest}
    environment:
      JWT_SECRET: *jwt-secret
    ports:
      - "8080:8080"
    cpus: 2
    depends_on:
      redis: { condition: service_healthy }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  kong:
    build: ./kong                     # kong:3.9 + configuration déclarative intégrée à l'image
    image: ${REGISTRE:-}boutique-kong:${TAG:-latest}
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_NGINX_WORKER_PROCESSES: "2"   # par défaut : un processus par cœur de l'hôte (836 Mio mesurés)
      # Cache DNS court : sans ce réglage, après la recréation des conteneurs (nouvelles IP), Kong a envoyé
      # /api/commandes vers un AUTRE service pendant 56 s (ancienne IP réattribuée).
      KONG_DNS_VALID_TTL: "5"
    ports:
      - "8000:8000"                   # trafic
      - "8001:8001"                   # API d'administration (lecture seule en mode sans base)
      - "8002:8002"                   # console Kong Manager
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------- Services métier ----------------
  identite:
    <<: *service
    build: { context: ./backend, args: { MODULE: identite } }
    image: ${REGISTRE:-}boutique-identite:${TAG:-latest}
    environment:
      JWT_SECRET: *jwt-secret

  catalogue:
    <<: *service
    build: { context: ./backend, args: { MODULE: catalogue } }
    image: ${REGISTRE:-}boutique-catalogue:${TAG:-latest}
    ports:
      - "8085:8080"                   # accès direct, sans passerelle (mesure de référence uniquement)
    depends_on:
      postgres: { condition: service_healthy }

  commandes:
    <<: *service
    build: { context: ./backend, args: { MODULE: commandes } }
    image: ${REGISTRE:-}boutique-commandes:${TAG:-latest}
    environment:
      <<: *env-bus
      DEMO_EVENEMENT_INVALIDE: "true"   # active POST /api/commandes/demo/evenement-invalide (scénario poison)
    depends_on:
      <<: *depend-bus
      postgres: { condition: service_healthy }

  notifications:
    <<: *service
    build: { context: ./backend, args: { MODULE: notifications } }
    image: ${REGISTRE:-}boutique-notifications:${TAG:-latest}
    environment: *env-bus
    depends_on: *depend-bus

  expedition:
    <<: *service
    build: { context: ./backend, args: { MODULE: expedition } }
    image: ${REGISTRE:-}boutique-expedition:${TAG:-latest}
    environment: *env-bus
    depends_on: *depend-bus

  # Nouveau service qui arrive après coup (démo de rejeu) : même image qu'expédition, autre groupe
  recommandations:
    <<: *service
    profiles: ["rejeu"]
    image: ${REGISTRE:-}boutique-expedition:${TAG:-latest}
    environment:
      <<: *env-bus
      SERVICE_NOM: recommandations
      GROUPE: ${GROUPE_REJEU:-recommandations}
    ports:
      - "8096:8080"                   # statistiques : http://localhost:8096/api/recommandations/stats
    depends_on: *depend-bus

  # ---------------- Données ----------------
  postgres:
    build: ./postgres                 # postgres:16 + script de création des bases
    image: ${REGISTRE:-}boutique-postgres:${TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commandes"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------------- Bus d'événements (un seul actif à la fois) ----------------
  rabbitmq:
    profiles: ["rabbit"]
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
    ports:
      - "15672:15672"                 # console : http://localhost:15672 (demo / demo)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      # Mode KRaft : un seul nœud joue broker + contrôleur (pas de ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-ui:
    profiles: ["kafka"]
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: petite-maison
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8081:8080"                   # console : http://localhost:8081

volumes:
  donnees-postgres:
