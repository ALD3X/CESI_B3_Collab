# Environnement dev (Docker Compose, projet boutique-dev) : seul le front est publié, sur le port 3100.
# Il peut tourner à côté de la boutique de démonstration locale (port 3000) sans conflit.
services:
  front:
    ports: !override
      - "3100:8080"
    environment:
      PASSERELLE_NOM: "Spring Cloud Gateway · dev"
  passerelle-spring: { ports: !reset [] }
  kong: { ports: !reset [] }
  catalogue: { ports: !reset [] }
  rabbitmq: { ports: !reset [] }
