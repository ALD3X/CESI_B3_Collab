# Pipeline CI/CD de la boutique — GitHub Actions (scénario de référence US-04.1)
# Étapes identiques au Jenkinsfile, mêmes outils et mêmes scripts (ci/*.sh) :
#   secrets ‖ backend (tests + couverture) ‖ front (tests + couverture) ‖ SAST + SCA
#   → build des 9 images → scan des images → test de bout en bout → publication (main)
name: CI/CD boutique

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.24.3
  TRIVY_IMAGE: aquasec/trivy:0.65.0
  SEMGREP_IMAGE: semgrep/semgrep:1.99.0

jobs:
  # ---------- 1. Qualité et sécurité du code (4 jobs en parallèle) ----------
  secrets:
    name: "Secrets (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recherche de secrets dans le code
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" dir /repo --no-banner --redact

  backend:
    name: "Backend : tests + couverture (Java 21)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests unitaires et d'intégration + seuil de couverture (70 % par service)
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Résumé dans l'interface GitHub
        if: always()
        run: |
          echo "### Tests backend" >> "$GITHUB_STEP_SUMMARY"
          for f in backend/*/target/surefire-reports/*.txt; do tail -n +4 "$f" | head -1; done >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-backend
          path: |
            backend/*/target/surefire-reports/
            backend/*/target/site/jacoco/

  front:
    name: "Front : tests + couverture (React)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Tests (Vitest) + seuil de couverture (70 %)
        run: npm test

  sast-sca:
    name: "SAST (Semgrep) + SCA (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAST - analyse statique de sécurité (bloquant si sévérité ERROR)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/java --config p/react --config p/secrets \
            --severity ERROR --error --metrics off --exclude "**/target" .
      - name: SCA - vulnérabilités des dépendances Maven et npm (bloquant si CRITIQUE corrigeable)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --quiet --scanners vuln \
            --severity CRITICAL --ignore-unfixed --exit-code 1 /src

  # ---------- 2. Images, scan, test de bout en bout, publication ----------
  images:
    name: "Build + scan des images + test de bout en bout + publication"
    needs: [secrets, backend, front, sast-sca]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Registre et version des images
        run: |
          echo "REGISTRE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build des 9 images (front, passerelle, 5 services, Kong, PostgreSQL)
        run: docker compose build
      - name: Scan des images (bloquant si vulnérabilité CRITIQUE corrigeable)
        run: sh ci/scan-images.sh
      - name: Test de bout en bout (boutique complète, parcours client)
        run: sh ci/smoke-test.sh boutique-ci
      - name: Connexion au registre GitHub (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication des images (branche main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker compose push
          echo "Images publiées : \`${REGISTRE}boutique-*:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
