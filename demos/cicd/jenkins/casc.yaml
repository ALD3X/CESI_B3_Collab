# Configuration de Jenkins par le code (Jenkins Configuration as Code)
jenkins:
  systemMessage: "Démo CI/CD — La Petite Maison de l'Épouvante (Jenkins auto-hébergé)"
  numExecutors: 4
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >
      pipelineJob('petite-maison-catalogue') {
        description('Pipeline CI/CD du mini-service catalogue (scénario de référence US-04.1)')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('* * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${REPO_URL:-file:///source}') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
