apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-publique
resources:
  - ../../../base/publique
configMapGenerator:
  - name: boutique-env
    literals:
      - ENVIRONNEMENT=prod
      - ZONE_APPLICATIVE=prod-applicative
      - ZONE_DONNEES=prod-donnees
patches:
  - target: { kind: Deployment }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: Service, name: front }
    patch: |-
      - { op: replace, path: /spec/ports/0/nodePort, value: 30080 }
